<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff7fa;
    color:#333;
}

header{
    background:linear-gradient(135deg,#e83e6f,orange);
    color:white;
    padding:15px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.cartTop{
    background:white;
    color:#e83e6f;
    border:none;
    padding:10px 16px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

.searchBox{
    max-width:1200px;
    margin:12px auto 0;
    display:flex;
    gap:8px;
}

.searchBox input{
    margin:0;
    border:none;
    outline:none;
    background:white;
    padding:12px 18px;
    border-radius:25px;
    flex:1;
    font-size:15px;
}

.searchBtn{
    border:none;
    background:white;
    color:#d93664;
    padding:0 18px;
    border-radius:25px;
    cursor:pointer;
    font-size:18px;
}

/*.categories{
    max auto 0;
    display:flex;
    gap:8px;
    overflow-x:auto;
*/
.categories {
    margin: 0 auto;
    padding: 10px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    white-space: nowrap;
    align-items: center;
    justify-content: flex-start;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}

.categories::-webkit-scrollbar {
    display: none;
}

.categories button{
    border:none;
    background:white;
    color:#d93664;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
}

.categories button.active{
    background:#d93664;
    color:white;
}

.hero{
    max-width:1200px;
    margin:20px auto;
    padding:45px 20px;
    text-align:center;
    background:linear-gradient(135deg,#ffe0e9,#fff);
    border-radius:25px;
}

.hero h1{
    color:#e83e6f;
    font-size:35px;
    margin-bottom:10px;
}

.hero p{
    color:black;
    margin-bottom:20px;
}

.shopBtn{
    border:none;
    background:#e83e6f;
    color:white;
    padding:13px 28px;
    border-radius:25px;
    cursor:pointer;
}

.container{
    width:94%;
    max-width:1200px;
    margin:auto;
}

.title{
    color:black;
    text-align:center;
    margin:25px 0 18px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:17px;
}

.product{
    background:white;
    border-radius:18px;
    padding:12px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
    border-radius:14px;
}

.product h3{
    margin:10px 0 5px;
    color:#d93664;
}

.product .price{
    color:#e83e6f;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.product button{
    border:none;
    padding:9px 11px;
    border-radius:20px;
    cursor:pointer;
    margin:3px;
}

.viewBtn{
    background:#ffe1e9;
    color:#d93664;
}

.addBtn{
    background:#ff5685;
    color:white;
}

.productId{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

#details{
    display:none;
    background:#fff0f4;
    max-width:650px;
    margin:25px auto;
    padding:22px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

#details img{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:18px;
}

#details h2{
    color:#d93664;
    margin:12px;
}

.detailPrice{
    color:#e83e6f;
    font-size:25px;
    font-weight:bold;
    margin:12px;
}

.detailAdd{
    background:#ff5685;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:25px;
    cursor:pointer;
}

.box{
    background:white;
    margin:30px auto;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.cartItem{
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.cartItem h3{
    color:#d93664;
    margin-bottom:6px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:12px;
    margin:10px 0;
}

.quantity button{
    width:34px;
    height:34px;
    border:none;
    border-radius:50%;
    background:#ff6f91;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.quantity span{
    font-weight:bold;
}

.removeBtn{
    border:none;
    background:#555;
    color:white;
    padding:7px 12px;
    border-radius:15px;
    cursor:pointer;
}

.total{
    text-align:right;
    color:#e83e6f;
    font-size:23px;
    font-weight:bold;
    margin-top:18px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    height:90px;
}

.orderBtn{
    width:100%;
    border:none;
    background:#e83e6f;
    color:white;
    padding:13px;
    border-radius:25px;

    font-size:17px;
    margin-top:10px;

    border-radius:20px;
    text-align:center;

footer{

    color:white;
    text-align:center;
    padding:25px;
    margin-top:30px;

/* =========================================
   CART
========================================= */

let cart = [];
let selectedProduct = null;


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts(list){

const box = document.getElementById("products");

box.innerHTML = "";

if(list.length === 0){

box.innerHTML =
"<p style='text-align:center;'>No products found 🔍</p>";

return;

}

list.forEach(function(product){

const index = products.indexOf(product);

box.innerHTML += `

<div class="product">

<img
src="${product.image}"
alt="${product.name}"
>

<div class="productId">
Product ID: ${product.id}
</div>

<h3>${product.name}</h3>

<div class="price">
₹${product.price}
</div>

<button
class="viewBtn"
data-view="${index}">
View Product
</button>

<button
class="addBtn"
data-add="${index}">
Add to Cart
</button>

</div>

`;

});

}


/* =========================================
   PRODUCT CLICK
========================================= */

document.getElementById("products")
.addEventListener("click",function(event){

if(event.target.dataset.view){

const index =
Number(event.target.dataset.view);

showDetails(products[index]);

}

if(event.target.dataset.add){

const index =
Number(event.target.dataset.add);

addToCart(products[index]);

}

});


/* =========================================
   PRODUCT DETAILS
========================================= */

function showDetails(product){

selectedProduct = product;

document.getElementById("details")
.style.display = "block";

document.getElementById("detailImage")
.src = product.image;

document.getElementById("detailName")
.textContent = product.name;

document.getElementById("detailQuality")
.textContent = product.quality;

document.getElementById("detailDescription")
.textContent = product.description;

document.getElementById("detailPrice")
.textContent = product.price;

document.getElementById("details")
.scrollIntoView({
behavior:"smooth"
});

}


/* =========================================
   DETAIL ADD
========================================= */

document.getElementById("detailAdd")
.addEventListener("click",function(){

if(selectedProduct){

addToCart(selectedProduct);

}

});


/* =========================================
   ADD TO CART
========================================= */

function addToCart(product){

const existing =
cart.find(function(item){

return item.id === product.id;

});

if(existing){

existing.quantity++;

}else{

cart.push({

id:product.id,
name:product.name,
price:product.price,
quality:product.quality,
quantity:1

});

}

updateCart();

}


/* =========================================
   UPDATE CART
========================================= */

function updateCart(){

const box =
document.getElementById("cartList");

const count =
document.getElementById("cartCount");

if(cart.length === 0){

box.innerHTML = `
<p style="text-align:center;">
Your Cart is Empty 🛒
</p>
`;

count.textContent = "0";

return;

}

let html = "";
let total = 0;
let totalQuantity = 0;

cart.forEach(function(item,index){

const subtotal =
item.price * item.quantity;

total += subtotal;
totalQuantity += item.quantity;

html += `

<div class="cartItem">

<h3>${item.name}</h3>

<p>
Product ID: ${item.id}
</p>

<p>
⭐ Quality: ${item.quality}
</p>

<p>
Price: ₹${item.price}
</p>

<div class="quantity">

<button data-minus="${index}">
−
</button>

<span>${item.quantity}</span>

<button data-plus="${index}">
+
</button>

</div>

<p>
Subtotal:
<b>₹${subtotal}</b>
</p>

<button
class="removeBtn"
data-remove="${index}">
Remove
</button>

</div>

`;

});

html += `
<div class="total">
Total: ₹${total}
</div>
`;

box.innerHTML = html;

count.textContent = totalQuantity;

}


/* =========================================
   CART ACTIONS
========================================= */

document.getElementById("cartList")
.addEventListener("click",function(event){

if(event.target.dataset.plus){

const index =
Number(event.target.dataset.plus);

cart[index].quantity++;

updateCart();

}

if(event.target.dataset.minus){

const index =
Number(event.target.dataset.minus);

if(cart[index].quantity > 1){

cart[index].quantity--;

}else{

cart.splice(index,1);

}

updateCart();

}

if(event.target.dataset.remove){

const index =
Number(event.target.dataset.remove);

cart.splice(index,1);

updateCart();

}

});


/* =========================================
   CATEGORIES
========================================= */

document.getElementById("categories")
.addEventListener("click",function(event){

if(!event.target.dataset.category){
return;
}

const category =
event.target.dataset.category;

document.querySelectorAll("#categories button")
.forEach(function(button){

button.classList.remove("active");

});

event.target.classList.add("active");

document.getElementById("searchInput").value = "";

if(category === "All"){

displayProducts(products);

}else{

const filtered =
products.filter(function(product){

return product.category === category;

});

displayProducts(filtered);

}

document.getElementById("products")
.scrollIntoView({
behavior:"smooth"
});

});


/* =========================================
   SEARCH
========================================= */

function searchProducts(){

const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

if(search === ""){

displayProducts(products);

return;

}

const filtered =
products.filter(function(product){

return product.name
.toLowerCase()
.includes(search)

||

product.category
.toLowerCase()
.includes(search)

||

product.id
.toLowerCase()
.includes(search);

});

displayProducts(filtered);

}

document.getElementById("searchInput")
.addEventListener("input",searchProducts);

document.getElementById("searchBtn")
.addEventListener("click",searchProducts);


/* =========================================
   SHOP NOW
========================================= */

document.getElementById("shopBtn")
.addEventListener("click",function(){

document.getElementById("products")
.scrollIntoView({
behavior:"smooth"
});

});


/* =========================================
   CART TOP
========================================= */

document.getElementById("cartTop")
.addEventListener("click",function(){

document.getElementById("cartBox")
.scrollIntoView({
behavior:"smooth"
});

});


/* =========================================
   PLACE ORDER
========================================= */

document.getElementById("orderBtn")
.addEventListener("click",async function(){

if(cart.length === 0){

alert("Please add a product to cart first 🛒");
return;

}

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

const address =
document.getElementById("address").value.trim();

const payment =
document.getElementById("payment").value;

if(
name === "" ||
phone === "" ||
address === "" ||
payment === ""
){

alert("Please fill all customer details and select payment method.");
return;

}

if(phone.length < 10){

alert("Please enter a valid mobile number.");
return;

}


/* =========================================
   ORDER CALCULATION
========================================= */

let quantity = 0;
let total = 0;

cart.forEach(function(item){

quantity += item.quantity;

total += item.price * item.quantity;

});


/*
   Multiple products असल्यास त्यांची नावे
   comma ने database मध्ये जातील.
*/

const productName =
cart.map(function(item){
return item.name;
}).join(", ");


/* =========================================
   SUPABASE INSERT
========================================= */

try{

const response = await fetch(

SUPABASE_URL + "/rest/v1/Order",

{

method:"POST",

headers:{

"Content-Type":"application/json",

"apikey":SUPABASE_KEY,

"Authorization":"Bearer " + SUPABASE_KEY,

"Prefer":"return=minimal"

},

body:JSON.stringify({

Customer_name:name,

Mobile_number:phone,

Address:address,

Product_name:productName,

Quantity:quantity,

Price:total,

Total:total,

Status:"Pending",

payment_method:payment

})

}

);


/* =========================================
   ERROR
========================================= */

if(!response.ok){

const errorText =
await response.text();

console.error(
"SUPABASE ERROR:",
errorText
);

alert(
"Order save झाला नाही.\n\n" +
errorText
);

return;

}


/* =========================================
   SUCCESS
========================================= */

document.getElementById("successText")
.innerHTML = `

Thank you
<b>${name}</b>! 💖

<br><br>

Order has been placed successfully! 🎉

<br><br>

Payment Method:
<b>${payment}</b>

<br><br>

Total Quantity:
<b>${quantity}</b>

<br><br>

Total Amount:
<b>₹${total}</b>

<br><br>

Status:
<b>Pending</b>

`;


document.getElementById("success")
.style.display = "block";


/* CLEAR CART */

cart = [];

updateCart();


/* CLEAR FORM */

document.getElementById("name").value = "";
document.getElementById("phone").value = "";
document.getElementById("address").value = "";
document.getElementById("payment").value = "";


/* SCROLL SUCCESS */

document.getElementById("success")
.scrollIntoView({
behavior:"smooth"
});


}catch(error){

console.error(
"CONNECTION ERROR:",
error
);

alert(
"Supabase connection होत नाही.\n\n" +
error.message
);

}

});


/* =========================================
   START
========================================= */

displayProducts(products);

updateCart();

</script>

</body>
</html>
