<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Glow Beauty - Owner Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff5f8;
    color:#333;
}

/* HEADER */

header{
    background:linear-gradient(
        135deg,
        #e83e6f,
        #ff91ad
    );

    color:white;
    padding:18px;
}

.header{
    max-width:1100px;
    margin:auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.headerButtons{
    display:flex;
    gap:8px;
}

.headerBtn{
    border:none;
    background:white;
    color:#e83e6f;

    padding:9px 14px;

    border-radius:20px;

    cursor:pointer;
    font-weight:bold;
}


/* LOGIN */

#loginPage{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.loginBox{
    width:100%;
    max-width:420px;

    background:white;

    padding:30px;

    border-radius:22px;

    box-shadow:
    0 5px 25px rgba(0,0,0,.12);

    text-align:center;
}

.loginBox h1{
    color:#d93664;
    margin-bottom:10px;
}

.loginBox p{
    color:#777;
    margin-bottom:20px;
}

.loginBox input{
    width:100%;

    padding:13px;

    margin:8px 0;

    border:1px solid #ddd;

    border-radius:10px;

    outline:none;
}

.loginBtn{
    width:100%;

    border:none;

    background:#e83e6f;

    color:white;

    padding:13px;

    border-radius:25px;

    cursor:pointer;

    font-size:16px;

    margin-top:10px;
}

.loginMessage{
    margin-top:15px;
    color:#d93664;
    font-size:14px;
}


/* ADMIN */

#adminPage{
    display:none;
}


/* CONTAINER */

.container{
    width:94%;
    max-width:1100px;
    margin:auto;
}

.dashboardTitle{
    color:#d93664;
    text-align:center;
    margin:25px 0;
}


/* STATS */

.stats{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(170px,1fr));

    gap:15px;

    margin-bottom:25px;
}

.stat{
    background:white;

    padding:20px;

    border-radius:18px;

    text-align:center;

    box-shadow:
    0 4px 15px rgba(0,0,0,.08);
}

.stat h2{
    color:#e83e6f;
    font-size:27px;
}

.stat p{
    color:#777;
    margin-top:5px;
}


/* RECENT ORDERS */

.recentBox{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;

    gap:10px;
}

.recentBox h2{
    color:#d93664;
}

.refreshBtn{
    border:none;

    background:#e83e6f;

    color:white;

    padding:9px 15px;

    border-radius:20px;

    cursor:pointer;
}


/* ORDER */

.order{
    background:white;

    padding:20px;

    border-radius:20px;

    margin-bottom:18px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.08);
}

.orderHeader{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;
}

.orderHeader h3{
    color:#d93664;
}

.orderId{
    background:#ffe2ea;

    color:#d93664;

    padding:7px 12px;

    border-radius:15px;

    font-size:13px;
}

.customer{
    margin-top:15px;

    line-height:1.8;
}

.customer b{
    color:#555;
}


/* PRODUCTS */

.orderProducts{
    margin-top:15px;

    border-top:1px solid #eee;

    padding-top:12px;
}

.orderProduct{
    padding:10px 0;

    border-bottom:1px solid #eee;
}

.orderProduct:last-child{
    border-bottom:none;
}


/* TOTAL */

.orderTotal{
    text-align:right;

    font-size:20px;

    font-weight:bold;

    color:#e83e6f;

    margin-top:12px;
}


/* STATUS */

.statusArea{
    margin-top:15px;

    display:flex;

    gap:10px;

    align-items:center;

    flex-wrap:wrap;
}

.statusArea select{
    padding:9px;

    border:1px solid #ddd;

    border-radius:10px;
}

.statusBtn{
    border:none;

    background:#e83e6f;

    color:white;

    padding:9px 15px;

    border-radius:20px;

    cursor:pointer;
}


/* EMPTY */

.empty{
    background:white;

    padding:40px 20px;

    text-align:center;

    border-radius:20px;

    color:#777;
}


/* FOOTER */

footer{
    text-align:center;

    padding:25px;

    margin-top:30px;

    background:#ff5685;

    color:white;
}


/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:19px;
    }

    .header{
        align-items:flex-start;
    }

    .headerButtons{
        flex-direction:column;
    }

    .order{
        padding:15px;
    }

    .orderTotal{
        text-align:left;
    }

}

</style>

</head>


<body>


<!-- =====================================
     LOGIN PAGE
====================================== -->

<div id="loginPage">

<div class="loginBox">

<h1>
✨ Glow Beauty
</h1>

<p>
Owner Login
</p>

<input
type="email"
id="ownerEmail"
placeholder="Owner Email"
>

<input
type="password"
id="ownerPassword"
placeholder="Password"
>

<button
class="loginBtn"
id="loginBtn"
>

🔐 Login

</button>

<p
class="loginMessage"
id="loginMessage"
></p>

</div>

</div>


<!-- =====================================
     ADMIN PAGE
====================================== -->

<div id="adminPage">


<header>

<div class="header">

<div class="logo">
✨ Glow Beauty Admin
</div>

<div class="headerButtons">

<button
class="headerBtn"
id="refreshBtn"
>
🔄 Refresh
</button>

<button
class="headerBtn"
id="logoutBtn"
>
Logout
</button>

</div>

</div>

</header>


<div class="container">


<h1 class="dashboardTitle">
📊 Shop Dashboard
</h1>


<!-- STATS -->

<div class="stats">


<div class="stat">

<h2 id="totalOrders">
0
</h2>

<p>
Total Orders
</p>

</div>


<div class="stat">

<h2 id="pendingOrders">
0
</h2>

<p>
Pending Orders
</p>

</div>


<div class="stat">

<h2 id="confirmedOrders">
0
</h2>

<p>
Confirmed Orders
</p>

</div>


<div class="stat">

<h2 id="totalSales">
₹0
</h2>

<p>
Total Sales
</p>

</div>


</div>


<!-- RECENT ORDERS -->

<div class="recentBox">

<h2>
📦 Latest 3 Orders
</h2>

<button
class="refreshBtn"
id="refreshOrders"
>
🔄 Refresh Orders
</button>

</div>


<div id="orders">

</div>


</div>


<footer>

<p>
✨ Glow Beauty Shop
</p>

<p>
Owner Admin Panel
</p>

</footer>


</div>


<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE CONNECTION
====================================== */


/*
   इथे तुझा Supabase URL आहे.
*/

const SUPABASE_URL =
"https://mozikyirwarsbjfbxkfj.supabase.co";


/*
   इथे तुझी Publishable / Anon Key टाक.

   IMPORTANT:
   Service Role / Secret Key इथे टाकू नकोस.
*/

const SUPABASE_KEY =
"sb_publishable_KVXWStl-aUMEiMTK4qs7iQ_I8hbrV4J";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   LOGIN
====================================== */

document
.getElementById("loginBtn")
.addEventListener(
"click",
async function(){

const email =
document
.getElementById("ownerEmail")
.value
.trim();

const password =
document
.getElementById("ownerPassword")
.value;


const message =
document
.getElementById("loginMessage");


if(
email === "" ||
password === ""
){

message.textContent =
"Please enter email and password.";

return;

}


message.textContent =
"Logging in...";


const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(error);

message.textContent =
"Wrong email or password.";

return;

}


document
.getElementById("loginPage")
.style.display="none";


document
.getElementById("adminPage")
.style.display="block";


loadOrders();

});


/* =====================================
   LOAD ORDERS
====================================== */

async function loadOrders(){

const ordersBox =
document.getElementById("orders");


ordersBox.innerHTML = `

<div class="empty">

<h2>
⏳ Loading Orders...
</h2>

<p>
Please wait...
</p>

</div>

`;


/*
   सर्व orders database मधून घेतो.

   Dashboard वर display फक्त latest 3.
*/

const {
data:orders,
error
} =
await supabaseClient

.from("Order")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(
"SUPABASE ERROR:",
error
);

ordersBox.innerHTML = `

<div class="empty">

<h2>
❌ Orders Load झाले नाहीत
</h2>

<p>
${error.message}
</p>

</div>

`;

return;

}


/* =====================================
   ALL ORDERS STATS
====================================== */

updateStats(
orders || []
);


/* =====================================
   LATEST 3 ONLY
====================================== */

const latestOrders =
(orders || []).slice(0,3);


if(latestOrders.length === 0){

ordersBox.innerHTML = `

<div class="empty">

<h2>
📦 No Orders Yet
</h2>

<p>
Customer orders will appear here.
</p>

</div>

`;

return;

}


ordersBox.innerHTML = "";


latestOrders.forEach(
function(order){

ordersBox.innerHTML +=
createOrderHTML(order);

});

}


/* =====================================
   CREATE ORDER HTML
====================================== */

function createOrderHTML(order){

const orderId =
order.id || "N/A";


const customer =
order.Customer_name ||
order.customer_name ||
"Customer";


const phone =
order.Mobile_number ||
order.mobile_number ||
"N/A";


const address =
order.Address ||
order.address ||
"N/A";


const productName =
order.Product_name ||
order.product_name ||
"N/A";


const quantity =
order.Quantity ||
order.quantity ||
0;


const price =
order.Price ||
order.price ||
0;


const total =
order.Total ||
order.total ||
0;


const payment =
order.payment_method ||
order.Payment_method ||
"Not Selected";


const status =
order.Status ||
order.status ||
"Pending";


const created =
order.created_at
?
new Date(
order.created_at
).toLocaleString()
:
"";


return `

<div class="order">


<div class="orderHeader">

<h3>
👤 ${escapeHTML(customer)}
</h3>

<span class="orderId">
Order #${orderId}
</span>

</div>


<div class="customer">

<b>📱 Mobile:</b>
${escapeHTML(phone)}

<br>

<b>📍 Address:</b>
${escapeHTML(address)}

<br>

<b>💳 Payment:</b>
${escapeHTML(payment)}

<br>

<b>🕐 Ordered:</b>
${escapeHTML(created)}

</div>


<div class="orderProducts">

<h3>
🛍️ Product
</h3>


<div class="orderProduct">

<b>
${escapeHTML(productName)}
</b>

<br>

Quantity:
${quantity}

<br>

Price:
₹${price}

<br>

Subtotal:
₹${total}

</div>


</div>


<div class="orderTotal">

Total:
₹${total}

</div>


<div class="statusArea">

<label>
<b>Status:</b>
</label>


<select
class="statusSelect"
data-id="${orderId}"
>

<option
value="Pending"
${status==="Pending" ? "selected" : ""}
>
Pending
</option>


<option
value="Confirmed"
${status==="Confirmed" ? "selected" : ""}
>
Confirmed
</option>


<option
value="Shipped"
${status==="Shipped" ? "selected" : ""}
>
Shipped
</option>


<option
value="Delivered"
${status==="Delivered" ? "selected" : ""}
>
Delivered
</option>


</select>


<button
class="statusBtn"
data-update="${orderId}"
>

Update Status

</button>

</div>


</div>

`;

}


/* =====================================
   UPDATE STATUS
====================================== */

document
.getElementById("orders")
.addEventListener(
"click",
async function(event){

const button =
event.target.closest(
"[data-update]"
);

if(!button){
return;
}


const id =
button.dataset.update;


const select =
document.querySelector(
`.statusSelect[data-id="${id}"]`
);


if(!select){
return;
}


const newStatus =
select.value;


const {
error
} =
await supabaseClient

.from("Order")

.update({

Status:newStatus

})

.eq(
"id",
id
);


if(error){

alert(
"Status update झाला नाही.\n\n" +
error.message
);

console.error(error);

return;

}


alert(
"Order status updated to " +
newStatus
);


loadOrders();

});


/* =====================================
   DASHBOARD STATS
====================================== */

function updateStats(orders){

let pending = 0;

let confirmed = 0;

let sales = 0;


orders.forEach(
function(order){

const status =
order.Status ||
order.status ||
"Pending";


const total =
Number(
order.Total ||
order.total ||
0
);


if(status === "Pending"){
pending++;
}


if(status === "Confirmed"){
confirmed++;
}


sales += total;

});


document
.getElementById("totalOrders")
.textContent =
orders.length;


document
.getElementById("pendingOrders")
.textContent =
pending;


document
.getElementById("confirmedOrders")
.textContent =
confirmed;


document
.getElementById("totalSales")
.textContent =
"₹" + sales;

}


/* =====================================
   ESCAPE HTML
====================================== */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =====================================
   REFRESH
====================================== */

document
.getElementById("refreshBtn")
.addEventListener(
"click",
loadOrders
);


document
.getElementById("refreshOrders")
.addEventListener(
"click",
loadOrders
);


/* =====================================
   LOGOUT
====================================== */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(){

await supabaseClient
.auth
.signOut();


document
.getElementById("adminPage")
.style.display="none";


document
.getElementById("loginPage")
.style.display="flex";


document
.getElementById("ownerEmail")
.value="";


document
.getElementById("ownerPassword")
.value="";

});


</script>


</body>

</html>
